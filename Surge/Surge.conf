💵 𝑷𝒂𝒚𝑷𝒂𝒍 = select, 🐼 Mainland, 🇭🇰Hong Kong, 🇺🇸United States
✉️ 𝑻𝒆𝒍𝒆𝒈𝒓𝒂𝒎 = select, 𝐀𝐮𝐭𝐨𝐦𝐚𝐭𝐢𝐜, 🇸🇬Singapore, 🇺🇸United States
