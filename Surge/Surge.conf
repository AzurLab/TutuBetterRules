🕊️ 𝑻𝒘𝒊𝒕𝒕𝒆𝒓 = select, 𝐀𝐮𝐭𝐨𝐦𝐚𝐭𝐢𝐜, 🇭🇰Hong Kong, 🇨🇳Taiwan, 🇸🇬Singapore, 🇯🇵Japan, 🇺🇸United States
